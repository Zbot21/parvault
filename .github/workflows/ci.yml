name: CI — Rust Test Suites, Multi-Container Docker Gate & TLA+ Formal Verification

on:
  push:
    branches: [main]
  # Every PR, including stacked PRs into non-main branches (B-36).
  pull_request:

# CodeQL alerts #1, #3, #41 (L-50): no job needs write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust Unit, Integration, Red-Team, TLA+ & Multi-Container Docker Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: GitHub Markdown Math & Currency Hazard Gate
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          TEXT_MACROS_RE = re.compile(r"\\(?:text|texttt|mathrm|mathbf)\s*\{([^{}]*)\}")

          def strip_inline_code(line: str) -> str:
              out, i, n = [], 0, len(line)
              while i < n:
                  if line[i] == "`":
                      j = i
                      while j < n and line[j] == "`":
                          j += 1
                      ticks = j - i
                      close = line.find("`" * ticks, j)
                      if close != -1:
                          end = close + ticks
                          out.append(" " * (end - i))
                          i = end
                          continue
                  out.append(line[i])
                  i += 1
              return "".join(out)

          def check_math_body(expr: str, path: str, line_no: int, is_display: bool, errors: list[str]) -> None:
              kind = "display $$" if is_display else "inline $"
              for m in TEXT_MACROS_RE.finditer(expr):
                  if "_" in m.group(1):
                      errors.append(f"{path}:{line_no}: [{kind}] underscore inside {m.group(0)!r}")
              if '"' in expr:
                  errors.append(f"{path}:{line_no}: [{kind}] double quote inside math: {expr.strip()!r}")
              if "`" in expr:
                  errors.append(f"{path}:{line_no}: [{kind}] backtick inside math: {expr.strip()!r}")
              if "&lt;" in expr or "&gt;" in expr:
                  errors.append(f"{path}:{line_no}: [{kind}] HTML entity &lt;/&gt; inside math: {expr.strip()!r}")
              if r"\!" in expr:
                  errors.append(f"{path}:{line_no}: [{kind}] '\\!' inside math: {expr.strip()!r}")
              if not is_display and ("<" in expr or ">" in expr):
                  errors.append(f"{path}:{line_no}: [inline $] raw '<' or '>' inside inline math: {expr.strip()!r}")

          def scan_file(path: str) -> list[str]:
              errors = []
              lines = open(path, encoding="utf-8").read().splitlines()
              in_fence, fence_char, fence_len = False, "", 0
              in_display, disp_start, disp_lines = False, 0, []
              n = len(lines)
              for idx, raw in enumerate(lines):
                  lno = idx + 1
                  lead = raw.lstrip(" >\t")
                  if not in_display:
                      mf = re.match(r"^(`{3,}|~{3,})(.*)$", lead)
                      if mf:
                          ch, rest = mf.group(1), mf.group(2)
                          if not in_fence and (ch[0] == "~" or "`" not in rest):
                              in_fence, fence_char, fence_len = True, ch[0], len(ch)
                              continue
                          elif in_fence and ch[0] == fence_char and len(ch) >= fence_len and rest.strip() == "":
                              in_fence, fence_char, fence_len = False, "", 0
                              continue
                  if in_fence:
                      continue
                  if in_display:
                      if re.match(r"^\$\$\s*$", raw):
                          if idx + 1 < n and lines[idx + 1].strip() != "":
                              errors.append(f"{path}:{lno}: [display $$] closing '$$' must be followed by blank line")
                          check_math_body("\n".join(disp_lines), path, disp_start, True, errors)
                          in_display, disp_lines = False, []
                      elif "$$" in raw:
                          errors.append(f"{path}:{lno}: [display $$] non-standalone '$$': {raw!r}")
                          in_display, disp_lines = False, []
                      else:
                          disp_lines.append(raw)
                      continue
                  if re.match(r"^\$\$\s*$", raw):
                      if idx > 0 and lines[idx - 1].strip() != "":
                          errors.append(f"{path}:{lno}: [display $$] opening '$$' must be preceded by blank line")
                      in_display, disp_start, disp_lines = True, lno, []
                      continue
                  masked = strip_inline_code(raw)
                  j, has_bad_dd = 0, False
                  while j < len(masked) - 1:
                      if masked[j] == "\\":
                          j += 2
                          continue
                      if masked[j] == "$" and masked[j + 1] == "$":
                          errors.append(f"{path}:{lno}: [display $$] single-line or indented '$$' forbidden: {raw.strip()!r}")
                          has_bad_dd = True
                          break
                      j += 1
                  if has_bad_dd:
                      continue
                  pos, j = [], 0
                  while j < len(masked):
                      if masked[j] == "\\":
                          j += 2
                          continue
                      if masked[j] == "$":
                          pos.append(j)
                      j += 1
                  if not pos:
                      continue
                  if len(pos) % 2 != 0:
                      errors.append(f"{path}:{lno}: [currency/math $] unbalanced '$' ({len(pos)} on line): {raw.strip()!r}")
                      continue
                  for k in range(0, len(pos), 2):
                      op, cp = pos[k], pos[k + 1]
                      inner = raw[op + 1 : cp]
                      if not inner or inner[0].isspace() or inner[-1].isspace():
                          errors.append(f"{path}:{lno}: [inline $] empty or space-padded '$...$': ${inner}$")
                          continue
                      if (op > 0 and masked[op - 1] == "~") or re.match(r"^\d[\d,.]*(?:/mo|/yr|\s*USD\b)|\d+\.\d+\s*[MBKk]\b", inner):
                          errors.append(f"{path}:{lno}: [currency $] unescaped currency '$': {raw.strip()!r}")
                      check_math_body(inner, path, lno, False, errors)
              if in_display:
                  errors.append(f"{path}:{disp_start}: [display $$] unclosed '$$' block")
              return errors

          out = subprocess.check_output(["git", "ls-files", "--cached", "--others", "--exclude-standard", "*.md"], text=True)
          md_files = sorted(p for p in out.splitlines() if p.strip() and os.path.isfile(p))
          errs = [e for p in md_files for e in scan_file(p)]
          if errs:
              print("\n".join(errs), file=sys.stderr)
              sys.exit(f"[GFM-MATH-FAIL] {len(errs)} hazard(s) across {len(md_files)} Markdown file(s).")
          print(f"[GFM-MATH-PASS] Checked {len(md_files)} Markdown file(s): 0 GFM math/currency hazards.")
          PY
      - name: Harden apt-get mirrors with retry fallback
        run: |
          for attempt in 1 2 3 4; do
            if sudo apt-get update -o Acquire::Retries=5; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "apt-get update failed after 4 attempts" >&2
              exit 1
            fi
            echo "apt-get update attempt ${attempt} failed; rewriting flaky azure/mirror+file sources to https://archive.ubuntu.com/ubuntu ..."
            sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i \
              -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu|g' {} + || true
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 3))
          done
      - name: Rust toolchain from rust-toolchain.toml (L-17)
        run: rustup toolchain install && rustc -V
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Doc metrics drift check (docs/metrics.txt vs. marked Markdown)
        run: bash scripts/sync_doc_metrics.sh --check --generate .
      - name: Download TLA+ Tools (tla2tools.jar) for Rust TLA+ Integration Tests
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          # Pinned digest of the v1.8.0 asset. Upstream republishes v1.8.0 as a rolling
          # pre-release; on mismatch, review and update this pin (B-39, B-67).
          echo "7e53aa636dac8a3cb0533f343115c0548e03fc0ce5edc7739becf58d3d0fb84f  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
          echo "TLA2TOOLS_JAR=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: No feature cfg inside claimed or Kani functions (plan-3 ruling change 5)
        run: bash scripts/check_claim_cfg.sh .
      - name: Plugin feature sets link no tokio, libp2p, mio or quinn (L-48)
        run: bash scripts/check_no_runtime_deps.sh .
      - name: Client-side unit tests and golden IPC wire bytes under ipc-client alone
        run: cargo test --locked --release --lib --no-default-features --features ipc-client
      - name: Manifest selection is compile time only; all-features builds are banned (L-16)
        run: bash scripts/check_manifest_cfg.sh .
      - name: Check minimal headless build (--no-default-features, VFS excluded)
        run: cargo check --locked --no-default-features --features daemon-runtime,manifest-household-ring-v1 --bin parvault --bin parvault-seed --bin parvault-sync
      - name: Release build environment cannot turn debug assertions on (v0.5.4, docs/METRICS.md)
        run: bash scripts/check_release_build_env.sh .
      - name: Build binaries (parvault, parvault-seed, parvault-fuse, parvault-sync)
        run: bash scripts/build_bins.sh --profile release --out dist
      - name: Scalar-only erasure coding in the shipped binaries (L-102)
        run: bash scripts/check_scalar_erasure_coding.sh dist/*
      - name: No insecure metrics listener in the release binaries (v0.5.4)
        run: bash scripts/check_no_insecure_metrics.sh dist/parvault dist/parvault-seed
      - name: Run all integration, formal (Stateright + TLA+ TLC), UDS zero-copy IPC & VFS test suites
        run: cargo test --locked --release
      - name: Run binary self-tests (parvault-seed, parvault gateway, parvault-fuse, parvault-sync)
        run: |
          dist/parvault-seed self-test
          dist/parvault gateway self-test
          bash scripts/plugin_self_test.sh dist/parvault dist/parvault-fuse dist/parvault-sync
      - name: Plugin claims against the no-default plugin artifacts (plan-3 ruling)
        run: |
          PARVAULT_PLUGIN_BIN_DIR="$PWD/dist" cargo test --locked --release --test plugin_self_test
          PARVAULT_PLUGIN_BIN_DIR="$PWD/dist" cargo test --locked --release --test trust_enforcement -- f43_plugin r3_sync_push status_sidecar
      - name: Run 13-Container Docker P2P Regression & Disaster Recovery Gate
        run: USE_GLIBC_IMAGE=1 bash scripts/docker_acceptance_gate.sh

  scalar-erasure-coding:
    # L-102: scalar-only erasure coding, enforced in CI. The shipped binaries are stripped, so the
    # rust-tests job checks only table content; this job builds unstripped so the symbol and
    # scoped-instruction checks run, and proves both checks flag a deliberately SIMD-enabled build.
    name: Scalar-only erasure coding (symbols and non-vacuity)
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_RELEASE_STRIP: "none"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain from rust-toolchain.toml (L-17)
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: No simd-accel anywhere in the feature graph
        run: |
          if cargo tree --locked -e features -i reed-solomon-erasure --all-features | grep -q 'simd-accel'; then
            echo "::error::reed-solomon-erasure/simd-accel is enabled"; exit 1
          fi
      - name: Cargo.lock holds no erasure-coding or GF crate but reed-solomon-erasure
        # The binary checks know only reed-solomon-erasure's kernel; this catches a SIMD kernel from
        # any other crate (reed-solomon-simd, reed-solomon-novelpoly, a renamed or git fork).
        run: bash scripts/check_scalar_erasure_coding.sh --cargo-lock Cargo.lock
      - name: Unstripped scalar build passes the symbol and instruction checks
        run: |
          cargo build --locked --release --bin parvault-bench
          cp target/release/parvault-bench "$RUNNER_TEMP/scalar-bench"
          bash scripts/check_scalar_erasure_coding.sh --require-symbols "$RUNNER_TEMP/scalar-bench"
      - name: Non-vacuity, a SIMD-enabled build is flagged by every check
        run: |
          cargo build --locked --release --bin parvault-bench --features reed-solomon-erasure/simd-accel
          bash scripts/check_scalar_erasure_coding.sh --expect-simd --require-symbols target/release/parvault-bench
          # The symbol-name check answers first on reedsolomon_gal_mul, so run the scoped
          # instruction scan alone too: it must flag the SIMD build by itself.
          bash scripts/check_scalar_erasure_coding.sh --expect-simd --insn-only target/release/parvault-bench
          if bash scripts/check_scalar_erasure_coding.sh target/release/parvault-bench; then
            echo "::error::the gate passed a SIMD build"; exit 1
          fi

  insecure-metrics-guard:
    # v0.5.4 (docs/METRICS.md): the release guard against the debug-only unauthenticated metrics
    # listener, with both negative controls. Control 2 is the exact bypass in the shipped build
    # shape (soc profile, static musl, stripped), caught by the marker alone.
    name: Insecure metrics release guard (negative controls)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y -o Acquire::Retries=5 musl-tools
      - name: Negative control 1, a dev build with the feature is flagged
        run: |
          cargo build --profile dev --features lab-insecure-metrics --bin parvault
          cp target/debug/parvault "$RUNNER_TEMP/nc1-parvault"
          rc=0; bash scripts/check_no_insecure_metrics.sh "$RUNNER_TEMP/nc1-parvault" || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::control 1: expected exit 1, got $rc"; exit 1; }
      - name: Negative control 2, the soc musl build with debug assertions forced on is flagged
        env:
          CARGO_PROFILE_SOC_DEBUG_ASSERTIONS: "true"
        run: |
          rc=0; bash scripts/check_release_build_env.sh . || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::control 2: build-env check expected exit 1, got $rc"; exit 1; }
          cargo build --profile soc --target x86_64-unknown-linux-musl --features lab-insecure-metrics -p parvault --bin parvault
          cp target/x86_64-unknown-linux-musl/soc/parvault "$RUNNER_TEMP/nc2-parvault"
          strip "$RUNNER_TEMP/nc2-parvault"
          rc=0; bash scripts/check_no_insecure_metrics.sh --marker-only "$RUNNER_TEMP/nc2-parvault" || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::control 2: marker scan expected exit 1, got $rc"; exit 1; }

  docs-commands:
    # L-34 (plan-7 section 3): every command block in README.md and QUICKSTART.md runs against
    # the release binaries in fresh ubuntu:24.04 containers (no Rust toolchain), or carries a
    # reasoned skip counted by docs/doc-commands.ratchet. Also tests install.sh against these
    # binaries served locally, and checks the claim labels.
    name: L-34 Docs Commands (README & QUICKSTART run verbatim)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the merge base, for the skip ratchet
      - name: docs/doc-commands.txt is current, fences are annotated, skips never increase
        run: |
          base_branch="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "$base_branch"
          if ! base="$(git merge-base HEAD "origin/$base_branch")" || [ -z "$base" ]; then
            echo "::error::no merge base between HEAD and origin/$base_branch (needs fetch-depth: 0); cannot check that skips never increase" >&2
            exit 1
          fi
          bash scripts/doc_commands.sh check --base "$base"
      - name: Runner positive controls (stdin closed, failures fail, dead daemons are not ready)
        run: bash scripts/doc_commands.sh selftest
      - name: Rust toolchain from rust-toolchain.toml (L-17)
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binaries (each with its own features)
        run: bash scripts/build_bins.sh --profile release --out dist
      - name: Run every documented command block
        run: bash scripts/doc_commands.sh run dist
      - name: install.sh installs its default version from release-style assets
        run: bash scripts/test_install.sh dist

  kani-bounded-model-check:
    name: Kani Rust Bounded Model Checking
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Harden apt-get mirrors before Kani installation
        run: |
          for attempt in 1 2 3 4; do
            if sudo apt-get update -o Acquire::Retries=5; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "apt-get update failed after 4 attempts" >&2
              exit 1
            fi
            echo "apt-get update attempt ${attempt} failed; rewriting flaky azure/mirror+file sources to https://archive.ubuntu.com/ubuntu ..."
            sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i \
              -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu|g' {} + || true
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 3))
          done
      - uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1 branch
        with:
          kani-version: '0.68.0'

  manifest-test-restricted:
    # L-16 S8 (G-1 C4, C10): the CI-only test-restricted manifest, with an explicit feature list
    # (never --all-features) for build, tests and Kani. It runs the manifest's own claims and the
    # lib tests, not the shared claim suite (which needs HandshakeWoT, refused by this manifest).
    name: Per-manifest job (manifest-test-restricted)
    runs-on: ubuntu-24.04
    env:
      MANIFEST_FEATURES: daemon-runtime,vfs,status-ui,manifest-test-restricted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (lib and bins) under the restricted manifest
        run: cargo clippy --locked --lib --bins --no-default-features --features "$MANIFEST_FEATURES" -- -D warnings
      - name: Lib tests under the restricted manifest
        run: cargo test --locked --release --lib --no-default-features --features "$MANIFEST_FEATURES"
      - name: Manifest claim MAN-VARIANT against the restricted binary
        run: cargo test --locked --release --no-default-features --features "$MANIFEST_FEATURES" --test trust_enforcement -- --exact man_variant_enabled_served man_variant_disabled_refused
      - name: The release check refuses the restricted binary (C10 reject)
        run: |
          cargo build --locked --release --no-default-features --features "$MANIFEST_FEATURES" --bin parvault
          if bash scripts/check_release_manifest.sh target/release/parvault; then
            echo "::error::check_release_manifest.sh accepted a test-restricted binary"; exit 1
          fi
      - name: Harden apt-get mirrors before Kani installation
        run: |
          for attempt in 1 2 3 4; do
            if sudo apt-get update -o Acquire::Retries=5; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "apt-get update failed after 4 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.68.0'
          args: --no-default-features --features daemon-runtime,vfs,status-ui,manifest-test-restricted --harness proof_manifest_variant_decision

  tla-model-check:
    name: TLA+ TLC Formal Model Checking
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Download TLA+ Tools (tla2tools.jar)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          # Pinned digest of the v1.8.0 asset. Upstream republishes v1.8.0 as a rolling
          # pre-release; on mismatch, review and update this pin (B-39, B-67).
          echo "7e53aa636dac8a3cb0533f343115c0548e03fc0ce5edc7739becf58d3d0fb84f  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
          echo "TLA2TOOLS_JAR=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Verify every TLA+ specification in specs/
        run: |
          # Every specs/*.tla is model-checked with its own .cfg; the count lives in docs/metrics.txt.
          cd specs
          shopt -s nullglob
          tla=(*.tla)
          if [ "${#tla[@]}" -eq 0 ]; then
            echo "::error::no specs/*.tla found" >&2
            exit 1
          fi
          for file in "${tla[@]}"; do
            spec="${file%.tla}"
            if [ ! -f "${spec}.cfg" ]; then
              echo "::error::specs/${spec}.tla has no specs/${spec}.cfg" >&2
              exit 1
            fi
          done
          # A variant cfg <Spec>.<Variant>.cfg runs too (for example RootOnDisk = FALSE, F-53 C3).
          for cfg in *.*.cfg; do
            if [ ! -f "${cfg%%.*}.tla" ]; then
              echo "::error::specs/${cfg} has no specs/${cfg%%.*}.tla" >&2
              exit 1
            fi
          done
          for file in "${tla[@]}"; do
            spec="${file%.tla}"
            for cfg in "${spec}.cfg" "${spec}".*.cfg; do
              echo "===> Model checking ${spec}.tla with ${cfg} ..."
              java -XX:+UseParallelGC -cp "$TLA2TOOLS_JAR" tlc2.TLC -workers auto -cleanup -config "${cfg}" "${spec}.tla"
            done
          done
