name: CI — Rust Test Suites, Multi-Container Docker Gate & TLA+ Formal Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  TLA2TOOLS_JAR: /tmp/tla2tools.jar

jobs:
  rust-tests:
    name: Rust Unit, Integration, Red-Team, TLA+ & Multi-Container Docker Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Harden apt-get mirrors with retry fallback
        run: |
          for attempt in 1 2 3 4; do
            if sudo apt-get update -o Acquire::Retries=5; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "apt-get update failed after 4 attempts" >&2
              exit 1
            fi
            echo "apt-get update attempt ${attempt} failed; rewriting flaky azure/mirror+file sources to https://archive.ubuntu.com/ubuntu ..."
            sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i \
              -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu|g' {} + || true
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 3))
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download TLA+ Tools (tla2tools.jar) for Rust TLA+ Integration Tests
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            -o /tmp/tla2tools.jar
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Check minimal headless build (--no-default-features, VFS excluded)
        run: cargo check --no-default-features --bin parvault-seed --bin parvault-gateway
      - name: Build binaries (parvault, parvault-seed, parvault-gateway, parvault-fuse)
        run: cargo build --release --bins
      - name: Run all integration, formal (Stateright + TLA+ TLC), UDS zero-copy IPC & VFS test suites
        run: cargo test --release
      - name: Run binary self-tests (parvault-seed, parvault-gateway, parvault-fuse)
        run: |
          ./target/release/parvault-seed self-test
          ./target/release/parvault-gateway self-test
          ./target/release/parvault-fuse self-test
      - name: Run 13-Container Docker P2P Regression & Disaster Recovery Gate
        run: USE_GLIBC_IMAGE=1 bash scripts/docker_acceptance_gate.sh

  kani-bounded-model-check:
    name: Kani Rust Bounded Model Checking (15 Symbolic Harnesses)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Harden apt-get mirrors before Kani installation
        run: |
          for attempt in 1 2 3 4; do
            if sudo apt-get update -o Acquire::Retries=5; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "apt-get update failed after 4 attempts" >&2
              exit 1
            fi
            echo "apt-get update attempt ${attempt} failed; rewriting flaky azure/mirror+file sources to https://archive.ubuntu.com/ubuntu ..."
            sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i \
              -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu|g' {} + || true
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 3))
          done
      - uses: model-checking/kani-github-action@v1

  tla-model-check:
    name: TLA+ TLC Formal Model Checking (7 Specs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download TLA+ Tools (tla2tools.jar)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            -o /tmp/tla2tools.jar
      - name: Verify all 7 TLA+ Protocol Specifications
        run: |
          cd specs
          for spec in ParVaultProtocol ParVaultConfidentialityAndTrust ParVaultAnonymity ParVaultPostQuantum ParVaultBootstrapAndEarnedTier ParVaultLiteClientAndSeedFailover ParVaultZeroKeyAdminAndQuorum; do
            echo "===> Model checking ${spec}.tla ..."
            java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC -workers auto -cleanup -config "${spec}.cfg" "${spec}.tla"
          done
