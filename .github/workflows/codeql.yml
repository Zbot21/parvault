name: CodeQL

# Advanced setup (L-50). The repository must be switched from CodeQL default setup to advanced
# setup in GitHub settings (Code security > Code scanning) for this workflow to take over.
on:
  push:
    branches: [main, "v0.5.0/**"]
  pull_request:
    branches: [main, "v0.5.0/**"]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
