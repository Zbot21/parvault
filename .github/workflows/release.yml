name: Release — Static musl Binaries & SHA256SUMS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-static-musl:
    name: Build Static musl (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            linker: x86_64-linux-musl-gcc
            strip: strip
          - target: aarch64-unknown-linux-musl
            linker: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl cross-compilation toolchain
        run: |
          for attempt in 1 2 3 4; do
            if sudo apt-get update -o Acquire::Retries=5 && \
               sudo apt-get install -y -o Acquire::Retries=5 musl-tools gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "apt-get failed after 4 attempts" >&2
              exit 1
            fi
            echo "apt-get attempt ${attempt} failed; rewriting flaky azure/mirror+file sources to https://archive.ubuntu.com/ubuntu ..."
            sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i \
              -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu|g' {} + || true
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 3))
          done
      - name: Build static parvault, parvault-seed, parvault-fuse, and parvault-sync binaries
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          fi
          # Each binary is built with its own feature set (plan-3 ruling change 9).
          bash scripts/build_bins.sh --profile soc --target ${{ matrix.target }} --out release-dist \
            parvault parvault-seed parvault-fuse parvault-sync parvault-status
          for bin in parvault parvault-seed parvault-fuse parvault-sync parvault-status; do
            ${{ matrix.strip }} "release-dist/${bin}-${{ matrix.target }}"
          done
          echo "### Binary sizes for ${{ matrix.target }} (--profile soc, stripped static musl):"
          ls -lh release-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: release-dist/*

  publish-release:
    name: Generate SHA256SUMS & Publish GitHub Release
    needs: build-static-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: install.sh defaults to this tag (plan-7; no Latest release to resolve)
        run: |
          stamped="$(sed -n 's/^VERSION="\${PARVAULT_VERSION:-\(v[^}]*\)}"$/\1/p' scripts/install.sh)"
          if [ "$stamped" != "$GITHUB_REF_NAME" ]; then
            echo "scripts/install.sh defaults to '$stamped' but the tag is '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          cp scripts/install.sh artifacts/install.sh
      - name: Bundle Router-SoC configuration and generate checksums
        run: |
          tar -czvf artifacts/parvault-router-soc-bundle.tar.gz -C deploy/router-soc parvault-router.toml parvault-nas.procd -C ../ prplos-lxc-manifest.json
          cd artifacts
          chmod +x parvault-x86_64-* parvault-aarch64-* parvault-seed-* parvault-fuse-* parvault-sync-* parvault-status-*
          echo "=== Measured Stripped Binary Sizes ==="
          ls -lh parvault-x86_64-* parvault-aarch64-* parvault-seed-* parvault-fuse-* parvault-sync-* parvault-status-*
          ./parvault-seed-x86_64-unknown-linux-musl self-test
          ./parvault-x86_64-unknown-linux-musl gateway self-test
          bash ../scripts/plugin_self_test.sh ./parvault-x86_64-unknown-linux-musl ./parvault-fuse-x86_64-unknown-linux-musl ./parvault-sync-x86_64-unknown-linux-musl
          sha256sum \
            parvault-x86_64-unknown-linux-musl parvault-aarch64-unknown-linux-musl \
            parvault-seed-x86_64-unknown-linux-musl parvault-seed-aarch64-unknown-linux-musl \
            parvault-fuse-x86_64-unknown-linux-musl parvault-fuse-aarch64-unknown-linux-musl \
            parvault-sync-x86_64-unknown-linux-musl parvault-sync-aarch64-unknown-linux-musl \
            parvault-status-x86_64-unknown-linux-musl parvault-status-aarch64-unknown-linux-musl \
            parvault-router-soc-bundle.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Every ParVault release is a pre-release until the owner says otherwise (2026-11-11):
          # never "Latest".
          prerelease: true
          make_latest: false
          files: |
            artifacts/parvault-x86_64-unknown-linux-musl
            artifacts/parvault-aarch64-unknown-linux-musl
            artifacts/parvault-seed-*
            artifacts/parvault-fuse-*
            artifacts/parvault-sync-*
            artifacts/parvault-status-*
            artifacts/parvault-router-soc-bundle.tar.gz
            artifacts/SHA256SUMS
            artifacts/install.sh
          generate_release_notes: true
