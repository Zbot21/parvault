name: Release — Static musl Binaries & SHA256SUMS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-static-musl:
    name: Build Static musl (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            linker: x86_64-linux-musl-gcc
            strip: strip
          - target: aarch64-unknown-linux-musl
            linker: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl cross-compilation toolchain
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 musl-tools gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Build static parvault, parvault-seed, parvault-gateway, and parvault-fuse binaries
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --profile soc --target ${{ matrix.target }} \
            --bin parvault --bin parvault-seed --bin parvault-gateway --bin parvault-fuse
          mkdir -p release-dist
          for bin in parvault parvault-seed parvault-gateway parvault-fuse; do
            cp "target/${{ matrix.target }}/soc/${bin}" "release-dist/${bin}-${{ matrix.target }}"
            ${{ matrix.strip }} "release-dist/${bin}-${{ matrix.target }}"
          done
          echo "### Binary sizes for ${{ matrix.target }} (--profile soc, stripped static musl):"
          ls -lh release-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: release-dist/*

  publish-release:
    name: Generate SHA256SUMS & Publish GitHub Release
    needs: build-static-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Bundle Router-SoC configuration and generate checksums
        run: |
          tar -czvf artifacts/parvault-router-soc-bundle.tar.gz -C deploy/router-soc parvault-router.toml parvault-nas.procd -C ../ prplos-lxc-manifest.json
          cd artifacts
          chmod +x parvault-x86_64-* parvault-aarch64-* parvault-seed-* parvault-gateway-* parvault-fuse-*
          echo "=== Measured Stripped Binary Sizes ==="
          ls -lh parvault-x86_64-* parvault-aarch64-* parvault-seed-* parvault-gateway-* parvault-fuse-*
          ./parvault-seed-x86_64-unknown-linux-musl self-test
          ./parvault-gateway-x86_64-unknown-linux-musl self-test
          ./parvault-fuse-x86_64-unknown-linux-musl self-test
          sha256sum \
            parvault-x86_64-unknown-linux-musl parvault-aarch64-unknown-linux-musl \
            parvault-seed-x86_64-unknown-linux-musl parvault-seed-aarch64-unknown-linux-musl \
            parvault-gateway-x86_64-unknown-linux-musl parvault-gateway-aarch64-unknown-linux-musl \
            parvault-fuse-x86_64-unknown-linux-musl parvault-fuse-aarch64-unknown-linux-musl \
            parvault-router-soc-bundle.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/parvault-x86_64-unknown-linux-musl
            artifacts/parvault-aarch64-unknown-linux-musl
            artifacts/parvault-seed-*
            artifacts/parvault-gateway-*
            artifacts/parvault-fuse-*
            artifacts/parvault-router-soc-bundle.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
