name: Repro Check — two builds in different directories match

# L-17: on a PR that touches the build inputs, build parvault (and the router bundle) twice per
# target inside deploy/Dockerfile.build, from two exports at different paths with different target
# dirs and CARGO_HOMEs, and fail unless every output matches byte for byte. The tag workflow
# (release.yml) does the same for every asset on separate runners.
on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - deploy/Dockerfile.build
      - deploy/router-soc/**
      - deploy/prplos-lxc-manifest.json
      - scripts/build_bins.sh
      - scripts/build_release.sh
      - scripts/make_bundle.sh
      - scripts/repro_proof.sh
      - .github/workflows/release.yml
      - .github/workflows/repro-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro-check:
    name: repro-check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build image (deploy/Dockerfile.build)
        run: docker build -f deploy/Dockerfile.build -t parvault-build .
      - name: Two builds, two directories, one result
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bundle=""; [ "$TARGET" = x86_64-unknown-linux-musl ] && bundle=--bundle
          bash scripts/repro_proof.sh --target "$TARGET" --work "$RUNNER_TEMP/repro" --image parvault-build $bundle parvault
      - name: diffoscope on mismatch
        if: failure()
        run: |
          sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y -o Acquire::Retries=5 diffoscope-minimal
          W="$RUNNER_TEMP/repro"; mkdir -p "$W/diffoscope"
          for f in $(cd "$W/a/out" && ls); do
            cmp -s "$W/a/out/$f" "$W/b/out/$f" || diffoscope --text "$W/diffoscope/$f.txt" "$W/a/out/$f" "$W/b/out/$f" || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: repro-diffoscope-${{ matrix.target }}
          path: ${{ runner.temp }}/repro/diffoscope/
