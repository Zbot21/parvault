[package]
name = "parvault"
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "ParVault — Zero-knowledge post-quantum erasure-coded backup utility and P2P storage daemon with Noise transport, Web-of-Trust, and Proof of Retrievability (PoR) auditing."

[[bin]]
name = "parvault"
path = "src/main.rs"
required-features = ["daemon-runtime"]

[[bin]]
name = "parvault-seed"
path = "src/bin/parvault-seed.rs"
required-features = ["daemon-runtime"]

[[bin]]
name = "parvault-fuse"
path = "src/bin/parvault-fuse.rs"
required-features = ["vfs"]

[[bin]]
name = "parvault-sync"
path = "src/bin/parvault-sync.rs"
required-features = ["ipc-client"]

[[bin]]
name = "parvault-bench"
path = "src/bin/parvault-bench.rs"
required-features = ["daemon-runtime"]

[lib]
name = "parvault"
path = "src/lib.rs"

[features]
default = ["daemon-runtime", "vfs"]
# The full daemon: tokio, libp2p and everything that drives the ring (item 3, L-48).
daemon-runtime = ["ipc-client", "dep:tokio", "dep:libp2p", "dep:async-trait"]
# The gateway socket client, wire types and client-side crypto: what a plugin links. No tokio or libp2p.
ipc-client = []
vfs = ["ipc-client"]
simd-accel = ["reed-solomon-erasure/simd-accel"]

[package.metadata.kani]
flags = { lib = true }

[dependencies]
tokio = { version = "1.40", optional = true, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
libp2p = { version = "0.54", optional = true, features = [
    "tokio",
    "gossipsub",
    "mdns",
    "noise",
    "yamux",
    "kad",
    "tcp",
    "quic",
    "ping",
    "identify",
    "request-response",
    "macros",
    "ed25519",
] }
reed-solomon-erasure = "6.0"
aes-gcm = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
unicode-normalization = "0.1"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "serde"] }
fips203 = "0.5.0"
fips204 = "0.5.0"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
base64 = "0.22"
toml = "0.8"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
anyhow = "1.0"
hex = "0.4"
async-trait = { version = "0.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.12"
stateright = "0.30"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.soc]
inherits = "release"
opt-level = "z"
lto = "fat"
