[package]
name = "parvault"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "ParVault — Zero-knowledge post-quantum erasure-coded backup utility and P2P storage daemon with Noise transport, Web-of-Trust, and Proof of Retrievability (PoR) auditing."

[[bin]]
name = "parvault"
path = "src/main.rs"

[[bin]]
name = "parvault-seed"
path = "src/bin/parvault-seed.rs"

[lib]
name = "parvault"
path = "src/lib.rs"

[features]
default = []
simd-accel = ["reed-solomon-erasure/simd-accel"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
libp2p = { version = "0.54", features = [
    "tokio",
    "gossipsub",
    "mdns",
    "noise",
    "yamux",
    "kad",
    "tcp",
    "quic",
    "ping",
    "identify",
    "request-response",
    "macros",
    "cbor",
    "ed25519",
] }
reed-solomon-erasure = "6.0"
aes-gcm = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ring = "0.17"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "serde"] }
fips203 = "0.5.0"
fips204 = "0.5.0"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
anyhow = "1.0"
hex = "0.4"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.12"
stateright = "0.30"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
