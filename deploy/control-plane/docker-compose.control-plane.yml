version: "3.9"

# Turnkey Neighborhood Cloud Control-Plane Stack (< $5/month on 1 Hetzner CX22 VPS)
# Includes:
#   1. parvault-seed (Public Bootstrap Seed Anchor #1 + Anonymous Telemetry Census Aggregator)
#   2. Prometheus (Scrapes anonymous network metrics every 15s, bound strictly to 127.0.0.1)
#   3. Grafana (Pre-provisioned live Network Size, Regional Extent & Seed Drain dashboards)
#   4. Caddy (Automatic Let's Encrypt HTTPS + Hardened Headers + 16KB Telemetry Body Limit)

services:
  parvault-seed:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.musl
    container_name: parvault-seed-primary
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    command:
      - "/usr/local/bin/parvault-seed"
      - "start"
      - "--mode"
      - "public-bootstrap"
      - "--listen"
      - "/ip4/0.0.0.0/tcp/4002"
      - "--data-dir"
      - "/data/parvault-seed"
      - "--max-gb"
      - "200"
    ports:
      - "4002:4002/tcp"
      - "127.0.0.1:9100:9100/tcp"
    volumes:
      - seed_data:/data/parvault-seed

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: parvault-prometheus
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=90d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: parvault-grafana
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme-neighborhood}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/stats/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  caddy:
    image: caddy:2.8-alpine
    container_name: parvault-website
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./website:/srv/website:ro
      - ../../dist:/srv/website/dist:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  seed_data:
  prom_data:
  grafana_data:
  caddy_data:
  caddy_config:
